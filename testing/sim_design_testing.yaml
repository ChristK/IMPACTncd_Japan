iteration_n: 15
clusternumber: 2 # explicit parallelisation (kept low: CI runners OOM when 4 forked workers write synthpops concurrently)
clusternumber_export: 2 # number of clusters for export_summaries (kept low for the same CI memory reason)
logs: yes
export_xps: yes
export_PARF: no
'n': 1000 # The number of simulants in each chunk. A Monte Carlo iteration consists of 1 to 10 chunks.
num_chunks: 2 # number of chunks (num_chunks is clearer than chunk_number)
parf_popsize: 2000 # Simulants per age x sex stratum used to estimate PARF
# (1 - 1/mean(prod(RR)) within each age x sex cell, no smoothing across age).
# Independent of 'n' above: the PARF population is a cartesian age x sex grid,
# not a sample of the synthetic population. Must be a positive multiple of 10.
#
# The model uses PARF only as p0 = mu * (1 - parf), so the error that matters is
# on (1 - parf) (~0.22), not on parf (~0.78). Measured on chd, relative error
# of p0 per age x sex cell:  100 -> 9.6% median / 27.4% worst;
# 1000 -> 3.0% / 8.7%;  2000 -> 2.2% / 6.1%. Error falls as 1/sqrt(parf_popsize),
# cost rises linearly (~36 min, ~21 MB for chd + stroke at 2000), and that cost is
# paid ONCE per PARF cache key then reused across all MC iterations and scenarios.
# Lower it to 100 only to reproduce pre-2026-08 results.
init_year_long: 2019  # Change-for-IMPACT-NCD-Japan Put the oldest year for observed exposures PLUS 10 (In 2003, most of our exposure variables were observed in NHNS except for LDL-c. LDL-c were collected after 2007. Need to be <= 2016 for costs to work.
sim_horizon_max: 2040 # population projections do not support longer horizon corresponding to CJ function
ageL: 30 # Simulated agents should be developed at least 10 years, and then developed in the next 5 years pass
ageH: 99 # This was based on observed exposure data and observed population size
apply_RR_to_mrtl2: yes # Is disease mortality influenced by exposures like incidence does? NOTE it affects nonmodelled as well
calibrate_to_incd_trends: yes # Use incidence calibration multipliers from file
calibrate_to_ftlt_trends: yes # Use fatality calibration multipliers from file
init_year_incd_calibration: no # Indicates whether parf*p0 is calibrated to incd for the initial year
incd_uncertainty_distr: beta #  The distribution of incidence uncertainty. Either beta or uniform.
prvl_uncertainty_distr: beta #  The distribution of prevalence uncertainty. Either beta or uniform.
ftlt_uncertainty_distr: beta #  The distribution of case fatality uncertainty. Either beta or uniform.
output_dir: ./outputs 
synthpop_dir: ./synthpop 

diseases:
- name: obesity
  friendly_name: Obesity
  meta:
    incidence:
      type: 1 # deterministically depend on exposure(s) not relative risk.
      aggregation: 'any' # Other option is "all". If more than one RF is case definition expects any or all to be present?. Irrelevant for 1 RF
      can_recur: yes # cure depends on the relevant exposure(s)
    diagnosis:
      type: 1
      probability: 1
      mm_wt: 0.0
    mortality:
      type: ~ # NULL
  notes: .na
- name: htn
  friendly_name: Hypertension
  meta:
    incidence:
      type: 1 # deterministically depend on exposure(s) not relative risk.
      aggregation: 'any' # Other option is "all". If more than one RF is case definition expects any or all to be present?. Irrelevant for 1 RF
      can_recur: no # once hypertensive always hypertensive
    diagnosis:
      type: 1
      probability: 1
      mm_wt: 0.0
    mortality:
      type: ~ # NULL
  notes: .na
- name: t2dm
  friendly_name: T2DM
  meta:
    incidence:
      type: 1
      aggregation: 'any' # Other option is "all". If more than one RF is case definition expects any or all to be present?. Irrelevant for 1 RF
      can_recur: no
    diagnosis:
      type: 1
      probability: 1
      mm_wt: 0.0
    mortality:
      type: ~
  notes: .na
- name: chd
  friendly_name: CHD
  meta:
    incidence:
      type: 2 # it depends on exposure and relative risk
      can_recur: no
    diagnosis:
      type: 1
      probability: 1
      duration_distr: NBI
      mm_wt: 0.49
    mortality:
      type: 1
      code: 2
  notes: .na
- name: stroke
  friendly_name: Stroke
  meta:
    incidence:
      type: 2
      can_recur: no
    diagnosis:
      type: 1
      probability: 1
      duration_distr: PIG
      mm_wt: 0.8
    mortality:
      type: 1
      code: 3
  notes: .na
- name: cvd
  friendly_name: CVD
  meta:
    incidence:
      type: 0 # this means that other diseases influence this disease to avoid double counting from CHD and stroke.
      influenced_by_disease_name:
        - chd
        - stroke
    diagnosis:
      type: 0
      mm_wt: 0.0
    mortality:
      type: ~
  notes: .na
- name: nonmodelled
  friendly_name: nonmodelled
  meta:
    incidence:
      type: Universal
    diagnosis:
      type: ~ # NULL
    mortality:
      type: 3 # influenced by
      influenced_by_disease_name:
        - t2dm
      # type: 1
      code: 1
  notes: .na
maxlag: 6 # To allow init year of 2001. 
jumpiness: 1.0 # increase for more erratic jumps in trajectories
keep_simulants_rn: yes # Keep the random numbers used to generate the exposures for each simulants
load_simulants_rn: yes # Load the random numbers used to generate the exposures for each simulants. Set to no if the random numbers are not necessary for the scenarios.
decision_aid: 0.8
stochastic: yes
kismet: yes
max_prvl_for_outputs: 2 # duration 1 is incidence and 2 is prevalence
iteration_n_max: 1000
scenarios: ''
cols_for_output:
- pid # NEED TO be 1st (perhaps not anymore)
- pid_mrk
- year
- mc
- age
- agegrp
- sex
- wt
- wt_esp
strata_for_output:
- scenario
- year
- agegrp
- sex
exposures:
- age
- sex
- Fruit_vege
- Smoking
- Smoking_number
- Med_HT
- Med_HL
- Med_DM
- PA_days
- PA_3cat
- BMI
- HbA1c
- LDLc
- SBP
